plugins {
    id 'com.android.application'
}

def nodeAbi = project.findProperty('nodeAbi') ?: 'arm64-v8a'

android {
    namespace 'com.albaik.pos.spike'
    compileSdk 36
    def ndkDir = System.getenv('ANDROID_NDK_HOME')
    if (ndkDir) ndkPath ndkDir

    defaultConfig {
        applicationId 'com.albaik.pos.spike'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.0.1-spike'
        ndk { abiFilters nodeAbi }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    sourceSets {
        main { jniLibs.srcDirs = ['libnode/bin'] }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    androidResources {
        noCompress 'zip'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
