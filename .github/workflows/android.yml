# Builds the Android APKs (main tablet runtime on nodejs-mobile) and smoke-tests
# the x86_64 build in an emulator: on-device servers, the POS WebView, and the
# electronAPI shim.
name: Android

on:
  push:
    branches: [claude/android-native-port-dt6xng]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Stage the Node bundle
        run: bash android/scripts/stage-node-project.sh
      - name: Build APKs
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../android-out
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/debug/app-${abi}-debug.apk" "../android-out/AlBaikPOS-${abi}-debug.apk"
          done
          ls -la ../android-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Al-Baik-POS-Android-debug
          path: android-out/*.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    name: Emulator smoke test (x86_64)
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the DevTools client (ws)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Al-Baik-POS-Android-debug
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/scripts/ci-smoke.sh apks/AlBaikPOS-x86_64-debug.apk android-smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Al-Baik-POS-Android-smoke
          path: android-smoke
          retention-days: 14
