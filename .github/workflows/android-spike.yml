# Throwaway Phase 0 spike for the Android port: builds a debug APK that runs the
# standalone backend on nodejs-mobile and probes it inside an Android emulator.
name: Android spike

on:
  push:
    branches: [claude/android-native-port-dt6xng]
    paths:
      - 'android-spike/**'
      - '.github/workflows/android-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24-backend:
    name: Backend on desktop Node 24 (no Electron)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --engine-strict=false
      - run: npx tsc && node scripts/copy-runtime-assets.cjs
      - name: Start dev-server.js and probe ports
        run: |
          node -v
          mkdir -p "$RUNNER_TEMP/flo"
          FLO_DEV_USER_DATA="$RUNNER_TEMP/flo" node dev-server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3001/api/health && break; sleep 1; done
          for p in 3001 3002 3003; do echo "port $p: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$p/api/health)"; done
          cat server.log
          curl -fsS http://127.0.0.1:3001/api/health

  build-apk:
    name: Build spike APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.3'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:frontend
      - name: Build APKs
        working-directory: android-spike
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          mkdir -p out
          for abi in arm64-v8a x86_64; do
            ./stage-node-project.sh "$abi"
            gradle --no-daemon assembleDebug -PnodeAbi="$abi"
            cp app/build/outputs/apk/debug/app-debug.apk "out/albaik-pos-spike-$abi-debug.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: albaik-pos-spike-apks
          path: android-spike/out/*.apk
          retention-days: 14

  emulator-smoke:
    name: Run spike APK in emulator
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: albaik-pos-spike-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android-spike/ci-smoke.sh apks/albaik-pos-spike-x86_64-debug.apk spike-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: albaik-pos-spike-emulator-results
          path: spike-results
          retention-days: 14
